# Render Blueprint — deploys the FastAPI backend.
# Render dashboard -> New -> Blueprint -> select this repo -> Apply.
# Gives a public URL like https://scamcheck-kz-api.onrender.com
services:
  - type: web
    name: scamcheck-kz-api
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
